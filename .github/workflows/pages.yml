name: Deploy WE狼殺上帝 PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild and verify PWA package
        shell: bash
        run: |
          mkdir -p _site
          cat             pwa_payload/part00.b64             pwa_payload/fix01a.b64             pwa_payload/fix01b_a.b64             pwa_payload/fix01b_b.b64             pwa_payload/part02.b64             pwa_payload/part03.b64             pwa_payload/part04.b64             pwa_payload/part05.b64             pwa_payload/part06.b64             pwa_payload/part07.b64 > pwa.zip.b64
          base64 --decode pwa.zip.b64 > pwa.zip
          echo "d33edd1dd1436abf779486cb9274361a5b410ddb064a95329fde5412021aa178  pwa.zip" | sha256sum -c -
          unzip -q pwa.zip -d _site
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/manifest.webmanifest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
