name: Deploy WE狼殺上帝 PWA

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild verified PWA base
        shell: bash
        run: |
          mkdir -p _site
          cat             pwa_payload/part00.b64             pwa_payload/fix01a.b64             pwa_payload/fix01b_a.b64             pwa_payload/fix01b_b.b64             pwa_payload/part02.b64             pwa_payload/part03.b64             pwa_payload/part04.b64             pwa_payload/part05.b64             pwa_payload/part06.b64             pwa_payload/part07.b64 > pwa.zip.b64
          base64 --decode pwa.zip.b64 > pwa.zip
          echo "d33edd1dd1436abf779486cb9274361a5b410ddb064a95329fde5412021aa178  pwa.zip" | sha256sum -c -
          unzip -q pwa.zip -d _site

      - name: Apply PWA Alpha 0.2.1 cloud-link hotfix
        shell: bash
        run: |
          cat pwa_patch/part00.b64 pwa_patch/part01.b64 > patch.zip.b64
          base64 --decode patch.zip.b64 > patch.zip
          echo "b3a9aaf11928dcfa5434798acef8cc22afb547fd622299bd12aa20f414548c33  patch.zip" | sha256sum -c -
          unzip -qo patch.zip -d _site

          sed -i 's#src="/app_core/rule_engine.js"#src="app_core/rule_engine.js"#g' _site/game.html
          sed -i 's#<script src="js/pwa.js"></script></body></html>#<script src="js/pwa.js"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script></body></html>#' _site/game.html
          sed -i 's#PWA ALPHA 0.2#PWA ALPHA 0.2.1#g' _site/index.html
          sed -i 's#WE 狼人殺 V6｜APP 0.1.3 Runtime#WE狼殺上帝｜PWA Alpha 0.2.1#g' _site/game.html
          sed -i 's#角色驅動｜單機／iPad主控＋電腦連動#角色驅動｜單機／iPad雲端主控＋電腦鏡像#g' _site/game.html
          sed -i "s#we-wolf-god-pwa-alpha-0.2-v1#we-wolf-god-pwa-alpha-0.2.1-v1#g" _site/sw.js

      - name: Apply PWA Alpha 0.3 first-night identity flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("runtime/identity_03_part01.b64")
          s = p.read_text()
          assert len(s) == 12000
          assert s[7012] == "z"
          s = s[:7012] + "j" + s[7013:]
          Path("identity_03_part01.fixed.b64").write_text(s)
          PY
          cat runtime/identity_03_part00.b64 identity_03_part01.fixed.b64 runtime/identity_03_part02.b64 > identity_03.b64
          base64 --decode identity_03.b64 > _site/js/identity-first-night.js
          echo "ec6c705664ac6d0cd0025947a53e0d58fb74932f785f656c7481536a18aab217  _site/js/identity-first-night.js" | sha256sum -c -

          # Load identity flow after the legacy runtime, before the cloud adapter.
          sed -i 's#<script src="js/pwa.js"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#<script src="js/pwa.js"></script><script src="js/identity-first-night.js?v=0.3"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#' _site/game.html

          # Visible version labels.
          sed -i 's#PWA ALPHA 0.2.1#PWA ALPHA 0.3#g' _site/index.html
          sed -i 's#PWA Alpha 0.2.1#PWA Alpha 0.3#g' _site/game.html

          # Cache the new runtime file and force installed clients to refresh.
          sed -i "s#'./js/pwa.js','./js/cloud-sync.js'#'./js/pwa.js','./js/identity-first-night.js','./js/cloud-sync.js'#" _site/sw.js
          sed -i "s#we-wolf-god-pwa-alpha-0.2.1-v1#we-wolf-god-pwa-alpha-0.3-v1#g" _site/sw.js

          cat > _site/pwa-version.json <<'JSON'
          {"name":"WE狼殺上帝","channel":"PWA","version":"0.3.0","features":["standalone","cloud-controller","pc-mirror","rex-voice-end-ack","public-display","first-night-identity-discovery","session-isolation"]}
          JSON

          # Static verification.
          node --check _site/js/identity-first-night.js
          test -f _site/index.html
          test -f _site/game.html
          test -f _site/js/cloud-sync.js
          test -f _site/js/identity-first-night.js
          test -f _site/sw.js
          grep -q 'PWA ALPHA 0.3' _site/index.html
          grep -q 'js/identity-first-night.js?v=0.3' _site/game.html
          grep -q 'WEWG-IDENTITY-FIRST-NIGHT-0.3' _site/js/identity-first-night.js
          grep -q 'we-wolf-god-pwa-alpha-0.3-v1' _site/sw.js
          grep -q "'./js/identity-first-night.js'" _site/sw.js

      - name: Apply PWA Alpha 0.3.1 night status tags
        shell: bash
        run: |
          cp runtime/status-tags-031.js _site/js/status-tags.js

          # Load status compatibility after first-night identity flow.
          sed -i 's#<script src="js/identity-first-night.js?v=0.3"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#<script src="js/identity-first-night.js?v=0.3"></script><script src="js/status-tags.js?v=0.3.1"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#' _site/game.html

          # Visible version labels.
          sed -i 's#PWA ALPHA 0.3#PWA ALPHA 0.3.1#g' _site/index.html
          sed -i 's#PWA Alpha 0.3#PWA Alpha 0.3.1#g' _site/game.html

          # Cache the compatibility runtime and force installed clients to refresh.
          sed -i "s#'./js/identity-first-night.js','./js/cloud-sync.js'#'./js/identity-first-night.js','./js/status-tags.js','./js/cloud-sync.js'#" _site/sw.js
          sed -i "s#we-wolf-god-pwa-alpha-0.3-v1#we-wolf-god-pwa-alpha-0.3.1-v1#g" _site/sw.js

          cat > _site/pwa-version.json <<'JSON'
          {"name":"WE狼殺上帝","channel":"PWA","version":"0.3.1","features":["standalone","cloud-controller","pc-mirror","rex-voice-end-ack","public-display","first-night-identity-discovery","night-action-status-tags","session-isolation"]}
          JSON

          # Static verification.
          node --check _site/js/status-tags.js
          grep -q 'PWA ALPHA 0.3.1' _site/index.html
          grep -q 'PWA Alpha 0.3.1' _site/game.html
          grep -q 'js/status-tags.js?v=0.3.1' _site/game.html
          grep -q 'WEWG-STATUS-TAGS-0.3.1' _site/js/status-tags.js
          grep -q 'we-wolf-god-pwa-alpha-0.3.1-v1' _site/sw.js
          grep -q "'./js/status-tags.js'" _site/sw.js

      - name: Apply PWA Alpha 0.4 10/18 competition build
        shell: bash
        run: |
          cp runtime/competition-1018.js _site/js/competition-1018.js
          cp runtime/app-1018.js _site/js/app.js
          cp runtime/session-store-1018.js _site/js/session-store.js

          # Load the competition patch after identity/status compatibility.
          sed -i 's#<script src="js/status-tags.js?v=0.3.1"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#<script src="js/status-tags.js?v=0.3.1"></script><script src="js/competition-1018.js?v=0.4"></script><script type="module" src="js/cloud-sync.js?v=0.2.1"></script>#' _site/game.html

          # Visible version labels.
          sed -i 's#PWA ALPHA 0.3.1#PWA ALPHA 0.4#g' _site/index.html
          sed -i 's#PWA Alpha 0.3.1#PWA Alpha 0.4#g' _site/game.html

          # Cache new runtime and force installed clients to refresh.
          sed -i "s#'./js/status-tags.js','./js/cloud-sync.js'#'./js/status-tags.js','./js/competition-1018.js','./js/cloud-sync.js'#" _site/sw.js
          sed -i "s#we-wolf-god-pwa-alpha-0.3.1-v1#we-wolf-god-pwa-alpha-0.4-v1#g" _site/sw.js

          cat > _site/pwa-version.json <<'JSON'
          {"name":"WE狼殺上帝","channel":"PWA","version":"0.4.0","build":"1018-competition","features":["standalone","cloud-controller","pc-mirror","first-night-identity-discovery","random-private-role-distribution","night-action-status-tags","mechanical-psychic-competition-flow","nightmare-dreamer-competition-flow","session-delete","session-isolation"]}
          JSON

          # Static verification.
          node --check _site/js/competition-1018.js
          node --check _site/js/app.js
          node --check _site/js/session-store.js
          grep -q 'PWA ALPHA 0.4' _site/index.html
          grep -q 'PWA Alpha 0.4' _site/game.html
          grep -q 'js/competition-1018.js?v=0.4' _site/game.html
          grep -q 'WEWG-COMPETITION-1018-0.4' _site/js/competition-1018.js
          grep -q 'deleteSession' _site/js/session-store.js
          grep -q '刪除此場次' _site/js/app.js
          grep -q 'we-wolf-god-pwa-alpha-0.4-v1' _site/sw.js
          grep -q "'./js/competition-1018.js'" _site/sw.js

      - name: Apply PWA Alpha 0.4.1 cache and nightmare fix
        shell: bash
        run: |
          cp runtime/pwa-041.js _site/js/pwa.js
          cp runtime/app-1018.js _site/js/app.js
          cp runtime/competition-1018.js _site/js/competition-1018.js

          # Force fresh homepage/module URLs so installed PWA clients cannot keep the 0.2 scripts.
          sed -i 's#js/pwa.js?v=0.2.0#js/pwa.js?v=0.4.1#g' _site/index.html
          sed -i 's#js/app.js?v=0.2.0#js/app.js?v=0.4.1#g' _site/index.html
          sed -i 's#js/competition-1018.js?v=0.4#js/competition-1018.js?v=0.4.1#g' _site/game.html

          # Make session management obvious on the homepage.
          sed -i 's#<h2>最近賽事</h2><div id="sessions"></div>#<h2>場次管理｜最近賽事</h2><p class="small">可開啟、個別刪除，或清除全部測試場次。</p><div id="sessions"></div>#' _site/index.html

          # Version/cache bump.
          sed -i 's#PWA ALPHA 0.4#PWA ALPHA 0.4.1#g' _site/index.html
          sed -i 's#PWA Alpha 0.4#PWA Alpha 0.4.1#g' _site/game.html
          sed -i "s#we-wolf-god-pwa-alpha-0.4-v1#we-wolf-god-pwa-alpha-0.4.1-v1#g" _site/sw.js

          cat > _site/pwa-version.json <<'JSON'
          {"name":"WE狼殺上帝","channel":"PWA","version":"0.4.1","build":"1018-competition-hotfix","features":["nightmare-night2-wolf-meet","session-delete-visible","forced-pwa-refresh","standalone","cloud-controller","pc-mirror","random-private-role-distribution","night-action-status-tags","mechanical-psychic-competition-flow","nightmare-dreamer-competition-flow"]}
          JSON

          node --check _site/js/pwa.js
          node --check _site/js/app.js
          node --check _site/js/competition-1018.js
          grep -q 'PWA ALPHA 0.4.1' _site/index.html
          grep -q '場次管理｜最近賽事' _site/index.html
          grep -q 'js/app.js?v=0.4.1' _site/index.html
          grep -q 'js/pwa.js?v=0.4.1' _site/index.html
          grep -q 'js/competition-1018.js?v=0.4.1' _site/game.html
          grep -q '刪除此場次' _site/js/app.js
          grep -q '狼人請睜眼。請選擇今晚擊殺的玩家。' _site/js/competition-1018.js
          grep -q 'we-wolf-god-pwa-alpha-0.4.1-v1' _site/sw.js

      - name: Rebuild verified 10/18 voice and day-selection corrections
        shell: bash
        run: |
          node runtime/fix-voice-042.cjs _site
          sed -i 's#PWA ALPHA 0.4.1#PWA ALPHA 0.4.2#g' _site/index.html
          sed -i 's#PWA Alpha 0.4.1#PWA Alpha 0.4.2#g' _site/game.html
          sed -i 's#js/competition-1018.js?v=0.4.1#js/competition-1018.js?v=0.4.2#g' _site/game.html
          sed -i 's#js/app.js?v=0.4.1#js/app.js?v=0.4.2#g' _site/index.html
          sed -i 's#js/pwa.js?v=0.4.1#js/pwa.js?v=0.4.2#g' _site/index.html
          sed -i 's#we-wolf-god-pwa-alpha-0.4.1-v1#we-wolf-god-pwa-alpha-0.4.2-v1#g' _site/sw.js
          sed -i 's#PWA-ALPHA-0.4.1#PWA-ALPHA-0.4.2#g' _site/js/pwa.js
          sed -i 's#sw.js?v=0.4.1#sw.js?v=0.4.2#g' _site/js/pwa.js
          node -e "const fs=require('fs'),vm=require('vm');const html=fs.readFileSync('_site/game.html','utf8');for(const m of html.matchAll(/<script(?:[^>]*)>([\\s\\S]*?)<\\/script>/g))if(m[1].trim())new vm.Script(m[1]);"
          node --check _site/js/competition-1018.js
          node runtime/verify-voice-042.cjs _site
          cat > _site/pwa-version.json <<'JSON'
          {"name":"WE狼殺上帝","channel":"PWA","version":"0.4.2","build":"1018-voice-day-vote-validation","features":["mechanical-night-two-order","first-night-mechanical-result-audio","single-channel-audio","sheriff-blue-light","vote-number-preservation","session-delete","night-action-status-tags"]}
          JSON

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
